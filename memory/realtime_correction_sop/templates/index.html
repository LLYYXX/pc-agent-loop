<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时纠偏系统</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#1a1a2e;color:#eee;height:100vh;display:flex;flex-direction:column}
header{padding:16px 24px;background:#16213e;border-bottom:1px solid #0f3460;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:500;flex:1;min-width:160px}
#stage-badge{background:#0f3460;padding:6px 14px;border-radius:20px;font-size:14px;color:#4fc3f7}
#btn-new-session{margin-left:auto;padding:8px 18px;border:1px solid #4fc3f7;background:linear-gradient(180deg,#1e3a5f 0%,#16213e 100%);color:#e3f2fd;border-radius:8px;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
#btn-new-session:hover:not(:disabled){background:#2563eb33;border-color:#81d4fa}
#btn-new-session:active:not(:disabled){transform:scale(.98)}
#btn-new-session:disabled{opacity:.55;cursor:wait}
.main{display:flex;flex:1;overflow:hidden}
#transcript{flex:2;padding:20px;overflow-y:auto;border-right:1px solid #0f3460}
#transcript h3{font-size:14px;color:#8aa4c8;margin-bottom:12px;font-weight:500}
#transcript .line{padding:4px 0;font-size:15px;line-height:1.6;color:#ccc}
#transcript .line .tag{color:#4fc3f7;margin-right:8px;font-size:13px}
#sidebar{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.alert-card{padding:12px 16px;border-radius:8px;font-size:14px;animation:slideIn .3s}
.alert-card.warn{background:#ff980020;border-left:3px solid #ff9800;color:#ffb74d}
.alert-card.error{background:#f4433620;border-left:3px solid #f44336;color:#ef9a9a}
.alert-card.ok{background:#4caf5020;border-left:3px solid #4caf50;color:#a5d6a7}
.alert-card.back{background:#9c27b020;border-left:3px solid #9c27b0;color:#ce93d8}
.alert-card.info{background:#2196f320;border-left:3px solid #2196f3;color:#90caf9}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
#sidebar h3{font-size:14px;color:#888;margin-bottom:4px}
</style>
</head>
<body>
<header>
<h1>🚗 汽车销售实时纠偏</h1>
<span id="stage-badge">等待开始</span>
<button type="button" id="btn-new-session" title="清空当前接待，开始下一位客户">新接待</button>
</header>
<div class="main">
<div id="transcript"><h3>对话实时识别</h3></div>
<div id="sidebar"><h3>现场提醒记录</h3></div>
</div>
<script>
const socket = io();
const transcript = document.getElementById('transcript');
const sidebar = document.getElementById('sidebar');
const badge = document.getElementById('stage-badge');
const icons = {ok:'✓', warn:'⚠', error:'🚫', stage:'📍', info:'ℹ', back:'🔙'};

socket.on('text', d => {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `<span class="tag">[${d.stage}]</span>${d.text}`;
  transcript.appendChild(div);
  transcript.scrollTop = transcript.scrollHeight;
});

socket.on('stage', name => {
  badge.textContent = name;
});

socket.on('log', d => {
  addCard(d.level, `${icons[d.level]||''} ${d.text}`);
});

socket.on('reset', () => {
  transcript.innerHTML = '<h3>对话实时识别</h3>';
  sidebar.innerHTML = '<h3>现场提醒记录</h3>';
  badge.textContent = '等待开始';
});

function addCard(cls, text) {
  const div = document.createElement('div');
  div.className = `alert-card ${cls}`;
  div.textContent = text;
  sidebar.appendChild(div);
  sidebar.scrollTop = sidebar.scrollHeight;
}

document.getElementById('btn-new-session').onclick = async () => {
  const btn = document.getElementById('btn-new-session');
  btn.disabled = true;
  try {
    const res = await fetch('/reset', { method: 'POST' });
    if (!res.ok) throw new Error(res.statusText);
    addCard('info', 'ℹ 已开启新接待');
  } catch (e) {
    addCard('error', '🚫 新接待失败，请重试');
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
